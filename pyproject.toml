[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "docsummarizer"
version = "2.0.1"
description = "Offline document summarization powered by a local LLM"
readme = "README.md"
license = { file = "LICENSE" }
# Upper bound measured 2026-11-21: CPython 3.10-3.15 resolve the core and gui
# dependencies from wheels alone on Linux, Windows and macOS; 3.16 does not
# (lxml, through python-docx, and PySide6 ship no 3.16 wheel).
requires-python = ">=3.10,<3.16"
authors = [{ name = "Wintersta7e" }]
keywords = ["llm", "summarization", "offline", "pdf", "docx", "qwen", "llama-cpp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    # Document parsing. pypdf <6.10.2 carries ~24 DoS advisories.
    "pypdf>=6.14,<7",
    "python-docx>=1.2,<2",
    "striprtf>=0.0.32",
    "chardet>=7.4,<8",
    # Utilities. tqdm <4.66.3 has CVE-2024-34062.
    "huggingface-hub>=1.21,<2",
    "tqdm>=4.68,<5",
    "psutil>=7.2,<8",
    # The language classifier: scores the evaluation metrics now and detects a
    # document's language later.
    "py3langid>=0.4,<0.5",
]

[project.optional-dependencies]
# `runtime` carries the heavy native LLM backend. CI installs the package
# without it (tests stub the Llama import).
runtime = [
    "llama-cpp-python>=0.3.31,<0.4",
]
# Exact pins, so every place the gate runs uses the same tool versions; uv.lock
# pins everything else. coverage and import-linter stay at their last release
# that still installs on Python 3.10, the lowest supported minor.
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "coverage==7.16.2",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "basedpyright==1.40.2",
    "import-linter==2.15",
    "deptry==0.25.1",
    "vulture==2.16",
]
gui = [
    # Native Qt/QML desktop UI (the "Abstract Console" redesign). Optional so a
    # CLI-only install stays lean; required to launch the desktop app and to
    # type-check / test the ui package.
    "PySide6>=6.7,<7",
]

[project.scripts]
docsummarizer-cli = "docsummarizer.cli:main"

[project.gui-scripts]
docsummarizer = "docsummarizer.ui.app:main"

[project.urls]
Homepage = "https://github.com/Wintersta7e/Doc-Summarizer"
Issues = "https://github.com/Wintersta7e/Doc-Summarizer/issues"
Releases = "https://github.com/Wintersta7e/Doc-Summarizer/releases"

[tool.uv]
# llama-cpp-python comes only from its prebuilt CPU wheels: its source build
# fails on the supported platforms.
no-build-package = ["llama-cpp-python"]

[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["src/docsummarizer"]

[tool.hatch.build.targets.sdist]
include = [
    "src/docsummarizer",
    "run.py",
    "README.md",
    "LICENSE",
    "DEVELOPMENT.md",
    "DocSummarizer.spec",
]

# --------------------------------------------------------------------------- #
# Ruff: linter + formatter
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflicts with `ruff format`, which owns trailing commas (130 hits).
    "COM812",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
# Optional, heavy or platform-only modules: imported inside the function that
# needs them, so a module-level import is an error and the lazy one is allowed.
banned-module-level-imports = [
    "docx",
    "llama_cpp",
    "py3langid",
    "pypdf",
    "resource",
    "striprtf",
    "tqdm",
]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "SPDX-License-Identifier: MIT"

[tool.ruff.lint.pep8-naming]
# Qt overrides and the bridge's QML-facing signals, properties and slots: QML
# binds these exact camelCase names.
extend-ignore-names = [
    "batchComplete", "batchProcess", "batchProgress", "batchRows", "batchRowsChanged", "beginDownload",
    "busyChanged", "canSummarize", "cancelSummarize", "checkModel", "computeLabel", "contextSize",
    "cpuCount", "createRequest", "currentFileName", "docChanged", "downloadChanged", "downloadPercent",
    "extractedText", "gpuEnabled", "gpuSupported", "hasDoc", "loadComplete", "loadDocument",
    "loadModel", "modelDownloaded", "modelName", "modelQuant", "modelReady", "modelReadyChanged",
    "modelSizeGb", "outputLanguage", "outputLanguages", "reloadArmed", "reloadArmedChanged", "reloadModel",
    "saveSummary", "savedFlash", "setAppearance", "setOutputLanguage", "setSummaryType", "setThreads",
    "settingsChanged", "statusChanged", "statusColor", "statusText", "summaryError", "summaryReady",
    "summaryType", "summaryTypeChanged", "summaryTypes", "toggleGpu", "unloadDocument", "urlToPath",
]

[tool.ruff.lint.per-file-ignores]
# pytest's assert is the test mechanism.
"tests/**" = ["S101"]
# Standard output is the interface of the CLI and of the dev scripts.
"src/docsummarizer/cli.py" = ["T201"]
"scripts/**" = ["T201"]
# These files run fixed tool argv lists, never a shell; S603 has no option to
# say so.
"scripts/check.py" = ["S603"]  # 1 hit
"scripts/eval/run.py" = ["S603"]  # 3 hits
"tests/test_eval_runner.py" = ["S603"]  # 1 hit
"tests/test_release_claims.py" = ["S603"]  # 1 hit

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------- #
# mypy: strict static type checking of the shipped code
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
mypy_path = ["src", "scripts"]
# scripts/ is a package for the linter; its eval package imports as `eval`.
explicit_package_bases = true
files = ["src/docsummarizer", "run.py", "scripts/eval"]

[[tool.mypy.overrides]]
# Third-party libraries without bundled type information. Treat their imports
# as untyped rather than erroring on the missing stubs.
module = [
    "pypdf.*",
    "llama_cpp.*",
    "huggingface_hub.*",
    "docx.*",
    "chardet.*",
    "tqdm.*",
    "psutil.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# striprtf ships no type information and *is* installed in CI, so strict mode
# would flag calls into it as "untyped". Skip following it — treat it as Any.
module = ["striprtf.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# py3langid ships no type information either; treat it as Any the same way.
module = ["py3langid.*"]
ignore_missing_imports = true
follow_imports = "skip"

# --------------------------------------------------------------------------- #
# pytest + coverage
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["windows: also run by the windows-latest CI job (Windows filesystem semantics)"]

[tool.coverage.run]
source = ["docsummarizer"]
branch = true
# ui/app.py launches the Qt event loop and needs a display; it's validated
# manually (its engine wiring is covered by the QML load test), so it's
# excluded from the coverage gate.
omit = ["*/ui/app.py"]

[tool.coverage.report]
show_missing = true
fail_under = 60
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
