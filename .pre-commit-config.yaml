# Local pre-commit hooks mirroring CI. Optional but recommended:
#   pip install pre-commit && pre-commit install
# CI remains the source of truth; these just catch issues before a commit.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # The dev environment's mypy, so it resolves the same installed
        # packages as CI; it reads its file list + overrides from pyproject.toml.
        entry: mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
