name: Weekly

on:
  schedule:
    # Mondays 05:17 UTC, off the hour when scheduled runs queue up.
    - cron: "17 5 * * 1"
  workflow_dispatch:

# Every job states the token rights it needs; none are granted by default.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  UV_VERSION: "0.13.9"
  PRIMARY_PYTHON: "3.12"
  QT_QPA_PLATFORM: offscreen
  QT_QUICK_BACKEND: software

jobs:
  mutation:
    name: Mutation testing of every module
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # mutation.py runs on half the cores: a full run took 25 minutes on 12
    # workers, and a 4-core runner gets 2.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PRIMARY_PYTHON }}
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install the locked dev and gui environment
        run: uv sync --locked --extra dev --extra gui

      - name: Mutation score of every module
        run: python scripts/mutation.py --all

  fuzz:
    name: Fuzz profile on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PRIMARY_PYTHON }}
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install the locked dev and gui environment
        run: uv sync --locked --extra dev --extra gui

      # The property tests' strategies at 10 000 examples each, random seeds.
      # A test may run far past the suite's 120-second hang limit here.
      - name: Property tests under the fuzz profile
        run: pytest tests/test_properties.py --hypothesis-profile=fuzz --timeout=3600

  links:
    name: Links, web ones included
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml --no-progress .
          jobSummary: false

  scorecard:
    name: OpenSSF Scorecard
    # Scorecard reads the default branch's settings; a run elsewhere scores nothing useful.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # Scorecard reads the workflow runs to score the CI checks
      security-events: write # the SARIF upload to code scanning
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Score the repository
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Publishing to the public Scorecard API is a repository owner's decision.
          publish_results: false

      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: scorecard.sarif
