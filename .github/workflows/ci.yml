name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Qt needs a few shared libraries even for the offscreen platform used by
      # the headless UI tests (no display/GPU required at runtime).
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      # llama-cpp-python is gated behind the `runtime` extra and intentionally
      # NOT installed in CI: it has no wheels for many matrix combos and source
      # builds are slow/fragile. Tests stub the lazy Llama import. The `gui`
      # extra (PySide6) IS installed so mypy can type-check the ui package and
      # the offscreen UI tests can run.
      - name: Install package + dev/gui extras
        run: pip install -e ".[dev,gui]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy --strict)
        run: mypy

      - name: Tests (pytest + coverage gate)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: pytest -ra --cov=docsummarizer --cov-report=term-missing
