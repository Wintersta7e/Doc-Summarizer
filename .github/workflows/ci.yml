name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      # uv installs the matrix interpreter and the exact dependency set in
      # uv.lock; the activated .venv puts its tools first on PATH.
      - name: Set up uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python }}
          activate-environment: true

      # Qt needs a few shared libraries even for the offscreen platform used by
      # the headless UI tests (no display/GPU required at runtime).
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      # llama-cpp-python is gated behind the `runtime` extra and intentionally
      # NOT installed in CI: tests stub the lazy Llama import. The `gui` extra
      # (PySide6) IS installed so basedpyright can type-check the ui package,
      # qmllint can run and the offscreen UI tests can run.
      - name: Install package + dev/gui extras from uv.lock
        run: uv sync --locked --extra dev --extra gui

      # Each step is one scripts/check.py step, in the order `check.py all`
      # runs them. The arch step's jscpd runs through the runner's Node.
      - name: Format check (check.py format)
        run: python scripts/check.py format

      - name: Lint (check.py lint)
        run: python scripts/check.py lint

      - name: Type check (check.py types)
        run: python scripts/check.py types

      - name: Architecture and hygiene (check.py arch)
        run: python scripts/check.py arch

      - name: QML lint (check.py qml)
        run: python scripts/check.py qml

      - name: Tests + coverage gate (check.py test)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python scripts/check.py test

  windows-tests:
    name: Windows filesystem tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
          python-version: "3.12"
          activate-environment: true

      - name: Install package + dev/gui extras from uv.lock
        run: uv sync --locked --extra dev --extra gui

      # Only the tests marked `windows`; no coverage (a subset would trip the
      # floor). pytest exits 5 when nothing is selected, which fails this job.
      - name: Tests marked windows
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: pytest -m windows -ra
